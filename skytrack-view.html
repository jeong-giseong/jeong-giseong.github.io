<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SkyTrack Live — 실시간 착륙 카운트다운</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; }
    body { background: #090d16; color: #f8fafc; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    #map { flex: 1; width: 100%; background: #090d16; }
    .top-pill {
      position: fixed; top: 14px; left: 14px; right: 14px; z-index: 1000;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(10px);
      padding: 10px 14px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
    }
    .badge { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 99px; background: rgba(16,185,129,0.18); color: #34d399; }
    .badge.est { background: rgba(245,158,11,0.2); color: #fbbf24; }
    .card {
      background: #0f172a; border-top: 1px solid rgba(255,255,255,0.12);
      padding: 18px 18px 24px; border-radius: 22px 22px 0 0; z-index: 1000;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.55);
    }
    .route-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .iata { font-size: 28px; font-weight: 800; letter-spacing: 0.5px; }
    .countdown { font-size: 14px; font-weight: 700; color: #38bdf8; text-align: center; }
    .meta-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      background: rgba(255,255,255,0.04); padding: 11px; border-radius: 14px; margin-bottom: 14px;
    }
    .meta-item span { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 3px; }
    .meta-item strong { font-size: 15px; color: #f1f5f9; }
    .cta-btn {
      display: block; width: 100%; text-align: center; text-decoration: none;
      background: linear-gradient(135deg, #2563eb, #0891b2); color: #fff;
      font-weight: 700; font-size: 14px; padding: 13px; border-radius: 14px;
    }
  </style>
</head>
<body>
  <div class="top-pill">
    <strong id="flightTitle">SkyTrack Live</strong>
    <span id="sigBadge" class="badge">SHARED RADAR</span>
  </div>
  <div id="map"></div>
  <div class="card">
    <div class="route-row">
      <div><div class="iata" id="depIata">---</div></div>
      <div class="countdown" id="etaCountdown">운항 스냅샷 불러오는 중...</div>
      <div style="text-align:right"><div class="iata" id="arrIata">---</div></div>
    </div>
    <div class="meta-grid">
      <div class="meta-item"><span>도착 터미널</span><strong id="arrTerm">-</strong></div>
      <div class="meta-item"><span>도착 게이트</span><strong id="arrGate">-</strong></div>
      <div class="meta-item"><span>수하물 벨트</span><strong id="bagBelt">-</strong></div>
    </div>
    <a class="cta-btn" id="openAppBtn" href="#">앱에서 선행기체 지연·벨트 즉시 알림 받기</a>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 기존 skytrack-view.html에 설정된 본인의 skytrack-proxy URL로 교체하세요
    const PROXY_URL = "https://uwljunvyyclkrezqotmy.supabase.co/functions/v1/skytrack-proxy";

    const params = new URLSearchParams(location.search);
    const flightIata = (params.get("flight") || "KE901").toUpperCase();
    const flightDate = params.get("date") || new Date().toISOString().slice(0, 10);
    document.getElementById("flightTitle").textContent = `✈️ ${flightIata} 실시간 마중 뷰`;

    const map = L.map("map", { zoomControl: false }).setView([36.5, 127.5], 4);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      maxZoom: 15, attribution: "&copy; OSM & CARTO"
    }).addTo(map);

    let snap = null;
    let planeMarker = null;
    let routeLine = null;

    function destPoint(lat, lon, brgDeg, distKm) {
      const d = distKm / 6371.0, brg = brgDeg * Math.PI / 180;
      const p1 = lat * Math.PI / 180, l1 = lon * Math.PI / 180;
      const p2 = Math.asin(Math.sin(p1)*Math.cos(d) + Math.cos(p1)*Math.sin(d)*Math.cos(brg));
      const l2 = l1 + Math.atan2(Math.sin(brg)*Math.sin(d)*Math.cos(p1), Math.cos(d) - Math.sin(p1)*Math.sin(p2));
      return [p2 * 180 / Math.PI, ((l2 * 180 / Math.PI + 540) % 360) - 180];
    }

    async function loadZeroCostSnapshot() {
      try {
        const res = await fetch(`${PROXY_URL}?action=viral_snapshot&flight=${encodeURIComponent(flightIata)}&date=${encodeURIComponent(flightDate)}`);
        const data = await res.json();
        if (!data.ok || !data.flight) {
          document.getElementById("etaCountdown").textContent = "앱에서 첫 조회 후 실시간 링크가 활성화됩니다";
          return;
        }
        snap = data.flight;
        document.getElementById("depIata").textContent = snap.dep_iata || "---";
        document.getElementById("arrIata").textContent = snap.arr_iata || "---";
        document.getElementById("arrTerm").textContent = snap.arr_terminal || "-";
        document.getElementById("arrGate").textContent = snap.arr_gate || "-";
        document.getElementById("bagBelt").textContent = snap.baggage_belt || "배정 대기";

        const raw = snap.raw_schedule_json || {};
        const depLoc = raw?.departure?.airport?.location;
        const arrLoc = raw?.arrival?.airport?.location;
        const wps = Array.isArray(snap.route_waypoints) ? snap.route_waypoints : [];
        if (depLoc && arrLoc) {
          const pts = [[depLoc.lat, depLoc.lon], ...wps, [arrLoc.lat, arrLoc.lon]];
          if (routeLine) map.removeLayer(routeLine);
          routeLine = L.polyline(pts, { color: "#38bdf8", weight: 2.5, dashArray: "6,6", opacity: 0.7 }).addTo(map);
        }
        if (!planeMarker) {
          const icon = L.divIcon({
            className: "",
            html: `<div id="rotPlane" style="font-size:22px;transform:rotate(${(snap.heading||90)-45}deg)">✈️</div>`,
            iconSize: [26, 26], iconAnchor: [13, 13]
          });
          planeMarker = L.marker([snap.lat, snap.lon], { icon }).addTo(map);
          map.setView([snap.lat, snap.lon], 5);
        }
      } catch (_) {}
    }

    function animate60fps() {
      if (snap && planeMarker) {
        const lastPosMs = snap.last_position_at ? new Date(snap.last_position_at).getTime() : 0;
        const elapsedSec = lastPosMs > 0 ? Math.max(0, (Date.now() - lastPosMs) / 1000) : 999;
        const badge = document.getElementById("sigBadge");

        // [패치 4] 105초 초과 또는 지상 상태에서는 무한 전진 차단(Clamping)
        if (!snap.on_ground && snap.is_live_radar && elapsedSec <= 105) {
          const effSec = elapsedSec <= 75 ? elapsedSec : 75 + 15 * Math.sin(((elapsedSec - 75) / 30) * Math.PI / 2);
          const distKm = ((snap.speed_kmh || 0) * effSec) / 3600.0;
          planeMarker.setLatLng(destPoint(snap.lat, snap.lon, snap.heading || 90, distKm));
          badge.textContent = "LIVE ADS-B";
          badge.className = "badge";
        } else {
          planeMarker.setLatLng([snap.lat, snap.lon]);
          badge.textContent = (snap.status || "").toUpperCase().includes("LAND") ? "LANDED" : "ESTIMATING";
          badge.className = "badge est";
        }

        if (snap.arr_time_utc) {
          const remMin = Math.round((new Date(snap.arr_time_utc).getTime() - Date.now()) / 60000);
          document.getElementById("etaCountdown").textContent =
            remMin <= 0 ? `${snap.arr_iata} 착륙 완료` : `착륙까지 약 ${Math.floor(remMin/60)}시간 ${remMin%60}분`;
        }
      }
      requestAnimationFrame(animate60fps);
    }

    loadZeroCostSnapshot();
    setInterval(loadZeroCostSnapshot, 45000);
    requestAnimationFrame(animate60fps);
  </script>
</body>
</html>
