<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SkyTrack Live Radar & Arrival Guide</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg-dark: #090D16;
      --bg-day-sea: #A8D5E8;
      --sky: #38BDF8;
      --cobalt: #1D4ED8;
      --emerald: #10B981;
      --amber: #F59E0B;
      --red: #EF4444;
      --text-sub: rgba(255, 255, 255, 0.65);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg-day-sea); color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      transition: background 0.3s ease;
    }
    body.night-mode { background: var(--bg-dark); }

    #map { position: absolute; inset: 0; z-index: 1; background: transparent; }

    /* 낮 모드: 연파랑 바다 유지 + 육지 따뜻한 샌드 베이지 보정 */
    body.day-mode .leaflet-tile-pane {
      filter: sepia(10%) saturate(106%) brightness(101%) contrast(98%);
    }
    /* 밤 모드: 심야 항공 관제 다크 네이비 레이더 */
    body.night-mode .leaflet-tile-pane {
      filter: invert(100%) hue-rotate(192deg) brightness(86%) contrast(96%) saturate(65%);
    }
    .leaflet-control-attribution { display: none !important; }

    /* 상단 트루 글래스모피즘 검색 카드 (alpha: 0.58 + blur: 24px) */
    .top-bar {
      position: absolute; top: 12px; left: 14px; right: 14px; z-index: 10;
      display: flex; flex-direction: column; gap: 6px; pointer-events: none;
    }
    .search-box {
      pointer-events: auto;
      display: flex; align-items: center; gap: 8px;
      background: rgba(15, 23, 42, 0.60);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1.1px solid rgba(255, 255, 255, 0.24);
      border-radius: 22px;
      padding: 8px 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }
    .tier-badge {
      padding: 4px 8px; border-radius: 8px; font-size: 10px; font-weight: 900;
      background: #2563EB; color: #fff; white-space: nowrap;
    }
    .tier-badge.pro { background: #FBBF24; color: #000; }
    .search-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: #fff; font-size: 15px; font-weight: 900; text-transform: uppercase; min-width: 70px;
    }
    .search-input::placeholder { color: rgba(255, 255, 255, 0.48); font-weight: 600; }
    .date-input {
      background: rgba(255, 255, 255, 0.12); border: none;
      color: #fff; border-radius: 10px; padding: 5px 8px; font-size: 11px; font-weight: 800; outline: none;
    }
    .search-btn {
      background: var(--sky); color: #090D16; border: none; border-radius: 50%;
      width: 30px; height: 30px; font-weight: 900; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* 우측 플로팅 글래스 컨트롤 도크 */
    .right-dock {
      position: absolute; right: 14px; top: 82px; z-index: 10;
      background: rgba(15, 23, 42, 0.58);
      backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 18px;
      padding: 6px; display: flex; flex-direction: column; gap: 6px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
    }
    .dock-btn {
      width: 35px; height: 35px; border-radius: 11px; border: none;
      background: transparent; color: var(--sky); font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .dock-btn.active {
      background: rgba(16, 185, 129, 0.25); border: 1px solid var(--emerald); color: #34D399;
    }

    /* 하단 3단계 프로그레시브 트루 글래스모피즘 모달 (이중 차폐 완전 제거) */
    .bottom-sheet {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
      max-height: 84vh; overflow-y: auto;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.60) 0%, rgba(9, 13, 22, 0.68) 100%);
      backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border-top: 1.2px solid rgba(255, 255, 255, 0.28);
      border-radius: 32px 32px 0 0;
      padding: 8px 22px calc(18px + env(safe-area-inset-bottom));
      box-shadow: 0 -6px 28px rgba(0, 0, 0, 0.35);
      transition: background 0.35s ease;
    }
    /* 3단 상세 확장 시 가독성 집중을 위해 배경 농도 소폭 상향 */
    .bottom-sheet.stage-3 {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.76) 0%, rgba(9, 13, 22, 0.84) 100%);
    }
    .bottom-sheet.stage-1 .stage-2-block,
    .bottom-sheet.stage-1 .stage-3-block { display: none; }
    .bottom-sheet.stage-2 .stage-3-block { display: none; }
    .bottom-sheet.stage-3 .expand-hint { display: none; }

    .drag-handle-wrap {
      width: 100%; padding: 4px 0 10px; cursor: pointer; display: flex; justify-content: center;
    }
    .drag-handle { width: 44px; height: 4.5px; background: rgba(255, 255, 255, 0.42); border-radius: 99px; }

    .header-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin-bottom: 12px; cursor: pointer;
    }
    .flight-title { font-size: 13.5px; font-weight: 900; color: var(--sky); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .airline-sub { font-size: 10.5px; font-weight: 600; color: rgba(255, 255, 255, 0.65); margin-top: 2px; }
    .status-pill {
      padding: 4px 10px; border-radius: 99px; font-size: 10.5px; font-weight: 900;
      border: 1px solid rgba(56, 189, 248, 0.65); background: rgba(56, 189, 248, 0.16); color: var(--sky);
      white-space: nowrap;
    }

    /* 1단계 메인 출도착 히어로 블록 */
    .route-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .airport-col { width: 28%; }
    .airport-col.right { text-align: right; }
    .iata-code { font-size: 35px; font-weight: 900; letter-spacing: -1.2px; line-height: 1.0; }
    .city-name { font-size: 11px; font-weight: 600; color: rgba(255, 255, 255, 0.72); margin: 4px 0 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .airport-time { font-size: 14px; font-weight: 800; color: #fff; display: inline-flex; align-items: center; gap: 4px; }
    .strike-time { font-size: 11.5px; font-weight: 600; color: rgba(255, 255, 255, 0.38); text-decoration: line-through; }
    .day-badge {
      font-size: 9.5px; font-weight: 900; color: #6EE7B7;
      background: rgba(16, 185, 129, 0.25); padding: 1px 4.5px; border-radius: 4px;
    }

    .track-col { flex: 1; padding: 0 10px; text-align: center; }
    .track-bar-wrap { position: relative; height: 28px; display: flex; align-items: center; }
    .track-bg { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.16); border-radius: 99px; }
    .track-fill { position: absolute; left: 0; height: 4px; background: linear-gradient(90deg, rgba(56,189,248,0.35), var(--sky)); border-radius: 99px; }
    .track-plane {
      position: absolute; width: 22px; height: 22px; border-radius: 50%;
      background: #0F172A; border: 1.5px solid var(--sky);
      display: flex; align-items: center; justify-content: center; font-size: 11px;
      transform: translateX(-50%); box-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
    }
    .track-label { font-size: 11px; font-weight: 800; color: var(--sky); margin-top: 4px; white-space: nowrap; }
