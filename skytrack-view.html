<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SkyTrack Live Family Flight Radar</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width: 100%; height: 100%; background: #0B1528; color: #fff; overflow: hidden; }
    #map { position: absolute; inset: 0; z-index: 1; background: #0B1528; }
    .leaflet-tile-pane { filter: brightness(0.88) contrast(1.12) saturate(1.1); }
    .top-pill {
      position: absolute; top: 16px; left: 16px; right: 16px; z-index: 10;
      background: rgba(15, 23, 42, 0.78); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 16px; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .badge { padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 800; background: rgba(16,185,129,0.2); color: #34D399; border: 1px solid #10B981; }
    .bottom-card {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
      background: rgba(15, 23, 42, 0.84); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1.5px solid rgba(56, 189, 248, 0.5); border-radius: 26px 26px 0 0;
      padding: 18px 20px calc(20px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 30px rgba(0,0,0,0.7);
    }
    .route-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 14px; }
    .iata { font-size: 34px; font-weight: 900; letter-spacing: -1px; }
    .time { font-size: 13px; color: #94A3B8; margin-top: 2px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .cell { background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 8px; text-align: center; }
    .cell-label { font-size: 10px; color: #94A3B8; font-weight: 700; }
    .cell-val { font-size: 15px; font-weight: 900; margin-top: 4px; color: #FBBF24; }
    .timeline { background: rgba(30, 58, 138, 0.3); border: 1px solid rgba(59, 130, 246, 0.45); border-radius: 12px; padding: 10px 12px; }
    .tl-title { font-size: 11.5px; color: #93C5FD; font-weight: 800; margin-bottom: 8px; }
    .tl-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .tl-step { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 6px; text-align: center; }
    .tl-step.active { background: rgba(16, 185, 129, 0.22); border: 1px solid #10B981; }
    .pulse-ring {
      width: 20px; height: 20px; border-radius: 50%; background: #38BDF8;
      box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.8); animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.8); }
      70% { box-shadow: 0 0 0 18px rgba(56, 189, 248, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="top-pill">
    <div>
      <div style="font-size:15px; font-weight:900; color:#38BDF8;" id="headerFlight">✈️ SkyTrack Family Live</div>
      <div style="font-size:11px; color:#CBD5E1; margin-top:2px;" id="headerSub">실시간 가족 항공편 관제 연결 중...</div>
    </div>
    <div class="badge" id="statusBadge">LIVE SYNC</div>
  </div>

  <div class="bottom-card">
    <div class="route-row">
      <div>
        <div class="iata" id="depIata">---</div>
        <div class="time" id="depTime">--:--</div>
      </div>
      <div style="flex:1; padding: 0 16px; text-align:center;">
        <div style="height:6px; background:#1E293B; border-radius:99px; overflow:hidden;">
          <div id="progBar" style="height:100%; width:40%; background:linear-gradient(90deg,#0284C7,#38BDF8);"></div>
        </div>
        <div style="font-size:11px; color:#38BDF8; font-weight:800; margin-top:6px;" id="progText">실시간 위치 동기화 중</div>
      </div>
      <div style="text-align:right;">
        <div class="iata" id="arrIata">---</div>
        <div class="time" id="arrTime">--:--</div>
      </div>
    </div>

    <div class="grid-4">
      <div class="cell"><div class="cell-label">출발 터미널</div><div class="cell-val" style="color:#fff;" id="depTerm">-</div></div>
      <div class="cell"><div class="cell-label">탑승구</div><div class="cell-val" id="depGate">-</div></div>
      <div class="cell"><div class="cell-label">도착 터미널</div><div class="cell-val" style="color:#fff;" id="arrTerm">-</div></div>
      <div class="cell"><div class="cell-label">수하물 벨트</div><div class="cell-val" style="color:#34D399;" id="bagBelt">배정 대기</div></div>
    </div>

    <div class="timeline">
      <div class="tl-title">🚗 마중·입국장 탈출 예상 타임라인 (자동 1분 갱신)</div>
      <div class="tl-steps">
        <div class="tl-step"><div style="font-size:10px; color:#94A3B8;">1. 게이트 접안</div><div style="font-size:13px; font-weight:900; margin-top:2px;" id="step1">--:--</div></div>
        <div class="tl-step"><div style="font-size:10px; color:#94A3B8;">2. 수하물 수취</div><div style="font-size:13px; font-weight:900; margin-top:2px;" id="step2">--:--</div></div>
        <div class="tl-step active"><div style="font-size:10px; color:#6EE7B7;">3. 입국장 출구</div><div style="font-size:13px; font-weight:900; margin-top:2px;" id="step3">--:--</div></div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const flightIata = (params.get('flight') || 'KE901').toUpperCase();
    const flightDate = params.get('date') || new Date().toISOString().slice(0, 10);
    const sharePass = params.get('pass') || 'verified';

    const map = L.map('map', { zoomControl: false }).setView([36.5, 127.5], 4);
    // API Key가 영구적으로 필요 없는 OpenStreetMap 표준 타일
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 16 }).addTo(map);

    let routeLine = null;
    let planeMarker = null;

    function fmtTime(isoStr, addMin = 0) {
      if (!isoStr) return '--:--';
      const d = new Date(new Date(isoStr).getTime() + addMin * 60000);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    async function syncFlight() {
      try {
        const res = await fetch('https://uwljunvyyclkrezqotmy.supabase.co/functions/v1/skytrack-proxy', {
          method: 'POST',
          headers: {
            'apikey': 'sb_publishable_ifdL5U3UB5mm4ns0_f1pKg_ssHAey9x',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            flight_iata: flightIata,
            flight_date: flightDate,
            share_pass: sharePass,
            client_premium: sharePass === 'verified'
          })
        });
        const data = await res.json();
        if (!data.flight) return;
        const f = data.flight;
        const raw = f.raw_schedule_json || {};
        const dLoc = raw.departure?.airport?.location || { lat: 37.4602, lon: 126.4407 };
        const aLoc = raw.arrival?.airport?.location || { lat: 35.7720, lon: 140.3929 };

        document.getElementById('headerFlight').textContent = `✈️ ${f.flight_iata} 실시간 가족 공유 레이더`;
        document.getElementById('headerSub').textContent = `고도 ${Math.round(f.altitude || 0).toLocaleString()} ft • 속도 ${Math.round(f.speed_kmh || 0)} km/h`;
        document.getElementById('statusBadge').textContent = f.status.toUpperCase();
        document.getElementById('depIata').textContent = f.dep_iata;
        document.getElementById('arrIata').textContent = f.arr_iata;
        document.getElementById('depTime').textContent = fmtTime(f.dep_time_utc);
        document.getElementById('arrTime').textContent = fmtTime(f.arr_time_utc);
        document.getElementById('depTerm').textContent = f.dep_terminal || '-';
        document.getElementById('depGate').textContent = f.dep_gate || '-';
        document.getElementById('arrTerm').textContent = f.arr_terminal || '-';
        document.getElementById('bagBelt').textContent = f.baggage_belt || '배정 대기';

        document.getElementById('step1').textContent = fmtTime(f.arr_time_utc, 10);
        document.getElementById('step2').textContent = fmtTime(f.arr_time_utc, 25);
        document.getElementById('step3').textContent = fmtTime(f.arr_time_utc, 35);

        const now = Date.now();
        const depMs = new Date(f.dep_time_utc).getTime();
        const arrMs = new Date(f.arr_time_utc).getTime();
        const pct = Math.min(100, Math.max(5, Math.round(((now - depMs) / Math.max(1, arrMs - depMs)) * 100)));
        document.getElementById('progBar').style.width = `${pct}%`;
        document.getElementById('progText').textContent = `${pct}% 진행 중`;

        if (routeLine) map.removeLayer(routeLine);
        routeLine = L.polyline([[dLoc.lat, dLoc.lon], [f.lat, f.lon], [aLoc.lat, aLoc.lon]], { color: '#38BDF8', weight: 4 }).addTo(map);

        const icon = L.divIcon({ className: '', html: '<div class="pulse-ring"></div>', iconSize: [20, 20] });
        if (planeMarker) map.removeLayer(planeMarker);
        planeMarker = L.marker([f.lat, f.lon], { icon }).addTo(map);
        map.panTo([f.lat, f.lon]);
      } catch (e) {}
    }

    syncFlight();
    setInterval(syncFlight, 60000);
  </script>
</body>
</html>
